name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── WebUI build ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build webui
        shell: bash
        working-directory: webui
        run: |
          npm ci
          npm run build

      # ── Python + PyInstaller (pinned via uv.lock) ───────────────
      # Build from the committed lockfile so the release bundles the EXACT,
      # locally-tested dependency set. Installing from pyproject's ">="
      # specifiers (plain `pip install`) lets transitive deps drift to
      # untested versions on the runner — e.g. pythonnet 3.1.0, whose
      # Python.Runtime has .NET dependencies that aren't satisfied on a clean
      # end-user machine, crashing pywebview at startup with
      # "Failed to resolve Python.Runtime.Loader.Initialize" (it can still load
      # on a dev box with .NET SDKs installed, so the bug is easy to miss).
      # `--frozen` also fails the build loudly if uv.lock drifts from
      # pyproject, instead of silently shipping a different resolution.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (frozen lock)
        shell: bash
        run: uv sync --frozen --group dev --python 3.11.9

      - name: PyInstaller build
        shell: powershell
        run: |
          uv run pyinstaller --noconfirm --clean tthol-reader.spec
          if (-not (Test-Path 'dist\tthol-reader\tthol-reader.exe')) {
            throw "PyInstaller did not produce tthol-reader.exe"
          }
          # .NET app config (loadFromRemoteSources) so the pythonnet/.NET
          # backend loads even when the downloaded zip is extracted with
          # Mark-of-the-Web. Must sit next to the exe, not under _internal.
          Copy-Item 'tthol-reader.exe.config' 'dist\tthol-reader\' -Force

      # ── Stage release contents ─────────────────────────────────
      - name: Stage release tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = '_stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # Everything PyInstaller produced (.exe + _internal/) is the install tree.
          robocopy 'dist\tthol-reader' $stage /E /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy stage failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          # User-visible files at install root.
          if (Test-Path 'README.md') { Copy-Item 'README.md' $stage\ -Force }

          # Sanity check.
          $required = @(
            "$stage\tthol-reader.exe",
            "$stage\tthol-reader.exe.config",
            "$stage\_internal\webui\dist\index.html",
            "$stage\_internal\knowledge.json",
            "$stage\_internal\tthol.sqlite"
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Missing required entry: $p" }
          }

      - name: Create release zip
        shell: powershell
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}"
          $zip = "tthol-reader-$tag.zip"
          7z a -mx=5 $zip .\_stage\* | Out-Null
          $size = '{0:N1} MB' -f ((Get-Item $zip).Length / 1MB)
          Write-Host "Created $zip ($size)"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: tthol-reader-*.zip
          generate_release_notes: true
