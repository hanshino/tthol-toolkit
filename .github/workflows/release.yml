name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── WebUI build ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build webui
        shell: bash
        working-directory: webui
        run: |
          npm ci
          npm run build

      # ── Python + PyInstaller ────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'

      - name: Install dependencies (runtime + pyinstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # Mirror the runtime extras vendored in the release: pull project
          # deps from pyproject.toml and add pyinstaller for the build.
          python - <<'PY'
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          deps = d["project"]["dependencies"]
          open("requirements-build.txt", "w").write("\n".join(deps + ["pyinstaller>=6.10"]))
          PY
          cat requirements-build.txt
          pip install -r requirements-build.txt

      - name: PyInstaller build
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean tthol-reader.spec
          if (-not (Test-Path 'dist\tthol-reader\tthol-reader.exe')) {
            throw "PyInstaller did not produce tthol-reader.exe"
          }

      # ── Stage release contents ─────────────────────────────────
      - name: Stage release tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = '_stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # Everything PyInstaller produced (.exe + _internal/) is the install tree.
          robocopy 'dist\tthol-reader' $stage /E /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy stage failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          # User-visible files at install root.
          if (Test-Path 'README.md') { Copy-Item 'README.md' $stage\ -Force }

          # Sanity check.
          $required = @(
            "$stage\tthol-reader.exe",
            "$stage\_internal\webui\dist\index.html",
            "$stage\_internal\knowledge.json",
            "$stage\_internal\tthol.sqlite"
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Missing required entry: $p" }
          }

      - name: Create release zip
        shell: powershell
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}"
          $zip = "tthol-reader-$tag.zip"
          7z a -mx=5 $zip .\_stage\* | Out-Null
          $size = '{0:N1} MB' -f ((Get-Item $zip).Length / 1MB)
          Write-Host "Created $zip ($size)"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: tthol-reader-*.zip
          generate_release_notes: true
