name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── WebUI build ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build webui
        shell: bash
        working-directory: webui
        run: |
          npm ci
          npm run build

      # ── Embeddable Python ───────────────────────────────────────
      - name: Download embeddable Python 3.11.9
        shell: powershell
        run: |
          curl.exe -L "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -o python-embed.zip
          New-Item -ItemType Directory -Path "toolkit\python" -Force | Out-Null
          Expand-Archive -Path "python-embed.zip" -DestinationPath "toolkit\python" -Force
          Remove-Item python-embed.zip

      - name: Configure embeddable Python paths
        shell: powershell
        run: |
          $pth = @"
          python311.zip
          .
          Lib\site-packages

          import site
          "@
          Set-Content -Path "toolkit\python\python311._pth" -Value $pth -Encoding ascii

          $sitecustom = @"
          import sys, os
          _here = os.path.dirname(os.path.abspath(__file__))
          _root = os.path.dirname(os.path.dirname(_here))
          if _root not in sys.path:
              sys.path.insert(0, _root)
          "@
          Set-Content -Path "toolkit\python\sitecustomize.py" -Value $sitecustom -Encoding ascii

      - name: Install pip into embeddable Python
        shell: powershell
        run: |
          curl.exe -L "https://bootstrap.pypa.io/get-pip.py" -o get-pip.py
          toolkit\python\python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py

      - name: Vendor runtime dependencies
        shell: powershell
        run: |
          python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); open('requirements.txt','w').write('\n'.join(d['project']['dependencies']))"
          Get-Content requirements.txt
          toolkit\python\python.exe -m pip install --no-warn-script-location -r requirements.txt
          # Slim site-packages: drop pip itself (no longer needed at runtime) & __pycache__
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue toolkit\python\Lib\site-packages\pip
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue toolkit\python\Lib\site-packages\pip-*.dist-info
          Get-ChildItem -Path toolkit\python -Recurse -Filter "__pycache__" -Directory |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      # ── Stage release contents ─────────────────────────────────
      - name: Stage release tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path _stage -Force | Out-Null

          $files = @(
            'start.bat', 'bootstrap.py', 'bootstrap_splash.html',
            'app.py', 'auto_detect.py', 'reader.py', 'warehouse_scan.py',
            'knowledge.json', 'tthol.sqlite',
            'icon.png', 'icon_small.png', 'brand_banner.png',
            'README.md'
          )
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f _stage\ -Force }
          }
          Set-Content -Path "_stage\VERSION" -Value "${{ steps.tag.outputs.TAG }}" -Encoding ascii -NoNewline

          # Trees: services / webui dist / toolkit (embeddable Python + vendored wheels)
          robocopy services _stage\services /E /XD __pycache__ /XF *.pyc *.pyo
          if ($LASTEXITCODE -ge 8) { throw "robocopy services failed: $LASTEXITCODE" }
          robocopy webui\dist _stage\webui\dist /E
          if ($LASTEXITCODE -ge 8) { throw "robocopy webui\dist failed: $LASTEXITCODE" }
          robocopy toolkit _stage\toolkit /E /XD __pycache__ /XF *.pyc *.pyo
          if ($LASTEXITCODE -ge 8) { throw "robocopy toolkit failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          # Sanity check: required entries must exist before zipping
          $required = @(
            '_stage\app.py', '_stage\bootstrap.py', '_stage\start.bat',
            '_stage\webui\dist\index.html',
            '_stage\toolkit\python\python.exe',
            '_stage\toolkit\python\pythonw.exe',
            '_stage\tthol.sqlite', '_stage\VERSION',
            '_stage\services\__init__.py'
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Missing required entry: $p" }
          }

      - name: Create release zip
        shell: powershell
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}"
          $zip = "tthol-reader-$tag.zip"
          7z a -mx=5 $zip .\_stage\* | Out-Null
          $size = '{0:N1} MB' -f ((Get-Item $zip).Length / 1MB)
          Write-Host "Created $zip ($size)"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: tthol-reader-*.zip
          generate_release_notes: true
