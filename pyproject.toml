[project]
name = "tthol-memory"
version = "0.1.0"
description = "Read-only memory reader UI for tthol"
requires-python = ">=3.11.9"
dependencies = [
    "psutil>=7.2.2",
    "pymem>=1.14.0",
    "pywin32>=311",
    "pywebview>=5.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.1",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
